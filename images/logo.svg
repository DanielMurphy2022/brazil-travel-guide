<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Beyond Brazil logo">
  <title>Beyond Brazil logo</title>
  <!-- Sun rising behind the leaves -->
  <g fill="#F7B733">
    <circle cx="24" cy="17" r="6.4"/>
    <ellipse cx="24" cy="5.6" rx="1.5" ry="3"/>
    <ellipse cx="15.6" cy="8.6" rx="1.4" ry="2.9" transform="rotate(-38 15.6 8.6)"/>
    <ellipse cx="32.4" cy="8.6" rx="1.4" ry="2.9" transform="rotate(38 32.4 8.6)"/>
    <ellipse cx="11.4" cy="16.4" rx="3" ry="1.4"/>
    <ellipse cx="36.6" cy="16.4" rx="3" ry="1.4"/>
  </g>
  <!-- Two leaves cupping the sun, with a small sprig on the left -->
  <g fill="#0B5236">
    <path d="M24 34c-8-3-12-10-10.6-19C21 18 25.2 25 24 34Z"/>
    <path d="M24 34c8-3 12-10 10.6-19C27 18 22.8 25 24 34Z"/>
    <path d="M14.6 25.6c-3.4-.5-5.4-2.6-5.6-6 3.4.5 5.4 2.6 5.6 6Z"/>
    <path d="M17.2 31.4c-3.4-.5-5.4-2.6-5.6-6 3.4.5 5.4 2.6 5.6 6Z"/>
  </g>
  <!-- Water below -->
  <g fill="none" stroke="#0B5236" stroke-width="2.6" stroke-linecap="round">
    <path d="M8.5 38.5c3.9-3 6.8 3 10.7 0s6.8 3 10.7 0 6.8 3 9.6 0"/>
    <path d="M14.5 44c3.2-2.6 5.6 2.6 8.8 0s5.6 2.6 8.8 0"/>
  </g>
</svg>
